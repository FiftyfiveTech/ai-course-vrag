[project]
name = "ai-course-track"
version = "0.1.0"
description = "<TRACK> — FiftyFive AI engineering course"
# 3.11 for tomllib in the stdlib: config.toml holds the pipeline levers (VRAG-005) and a
# config reader is not worth a third-party dependency.
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "groq>=0.9",
    "ollama>=0.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so tests can `from src.doctor import ...` without an editable install
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
