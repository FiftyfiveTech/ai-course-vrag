[project]
name = "ai-course-track"
version = "0.1.0"
description = "<TRACK> — FiftyFive AI engineering course"
# 3.11 for tomllib in the stdlib: config.toml holds the pipeline levers (VRAG-005) and a
# config reader is not worth a third-party dependency.
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "groq>=0.9",
    "ollama>=0.3",
    "chromadb>=0.5",
    # schemas/ — structured model output is validated, not parsed by hand (README). Already
    # in the tree as a chromadb dependency; declared here because src/answer.py imports it
    # directly and a transitive dependency is not a promise.
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so tests can `from src.doctor import ...` without an editable install
pythonpath = ["."]
# tests/gates/README names the gates gate_phase0.py, gate_phase1.py, ... and pytest's default
# python_files is "test_*.py *_test.py", so `pytest tests/gates` collected only
# test_no_leakage.py and reported 24 passed having run no phase gate at all. Naming a file
# explicitly (`pytest tests/gates/gate_phase0.py`) collects it regardless, which is how the
# Phase 0 gate was ever seen to pass and why nothing caught this. A green `make gate` that
# runs zero gates is the exact failure mode this repo keeps writing rules about.
python_files = ["test_*.py", "gate_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "schemas"]
