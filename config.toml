# VRAG pipeline configuration.
#
# Anything that is a cost or quality lever lives in this file, not in code. The point of
# the split is that you can change what the pipeline costs without touching a module and
# without a rebuild — and that the value that produced a run is recorded next to it, in
# every run's media.json.
#
# Read by src/config.py. Every module takes the parsed table as an argument; nothing
# reaches for a global.

[ingest.audio]
# 16 kHz mono signed 16-bit PCM. This is not a preference, it is what the ASR arms in
# VRAG-008 want: whisper-large-v3-turbo resamples to 16 kHz internally, so handing it
# anything richer costs upload bytes and buys nothing.
sample_rate_hz = 16000
channels = 1
codec = "pcm_s16le"

[ingest.frames]
# THE cost lever of Phase 0 (see VRAG-007). Frames sampled per second of video.
#
#   0.2  = one frame every 5 s   — 720 frames from a 1 h video
#   1.0  = one frame every 1 s   — 3600 frames, 5× the vision spend, for slide decks
#   0.05 = one frame every 20 s  — cheap, misses any slide shown briefly
#
# Start at 0.2 and let a measured number move it, not a hunch.
fps = 0.2

# Hard ceiling per video, so a long video cannot quietly fill the disk. Video-MME's long
# bucket runs to ~1 h, so 1200 frames at fps=0.2 covers it with room to spare. If the
# ceiling ever bites, ingest says so loudly rather than silently truncating coverage.
max_frames = 1200

# Longest edge of a sampled frame, in pixels. -1 keeps the source size. Height is derived
# from the aspect ratio. 768 is the short side most hosted vision endpoints downscale to
# anyway, so anything larger is bytes on the wire for no extra detail.
width = 768

format = "jpg"

# libjpeg quality scale as ffmpeg spells it: 2 is near-lossless, 31 is worst. 4 is visually
# clean on slide text, which is what OCR in VRAG-023 has to read.
jpeg_quality = 4

[sample.synthetic]
# The clip `make sample` generates for the gate to run on. No video can be committed — the
# Video-MME terms forbid redistributing the benchmark, and .gitignore blocks *.mp4 — so the
# fixture is made locally from ffmpeg's own sources. testsrc2 draws a running frame counter,
# which is what lets you open a sampled frame and check its recorded timestamp by eye.
#
# 30 s at fps=0.2 is 6 frames: small enough that the gate is quick, big enough that frame
# timestamps and the max_frames ceiling are both visible.
duration_s = 30
width = 1280
height = 720
fps = 25
tone_hz = 440

[sample.real]
# `make sample-real VIDEO_ID=…` pulls a corpus video from the url in the manifest, which is
# what PROVENANCE tells a reproducer to do. Capped at 720p: ingest downsamples frames to 768
# px anyway, so a 4K pull is bandwidth spent on pixels we throw away.
max_height = 720

[embed]
# Embedding model, named by HF repo id.  Must be pulled in Ollama first:
#   ollama pull hf.co/nomic-ai/nomic-embed-text-v1.5-GGUF
# nomic-embed-text-v1.5 is 137 M params and runs on CPU in ~30 ms per chunk.
#
# The repo id carries the -GGUF suffix because Ollama can only load GGUF weights, and the
# measurement that forced it (VRAG-017, first time anything actually pulled this model):
#
#   ollama pull hf.co/nomic-ai/nomic-embed-text-v1.5
#   Error: pull model manifest: 400: {"error":"Repository is not GGUF or is not compatible
#   with llama.cpp"}
#
# nomic-ai/nomic-embed-text-v1.5 ships Sentence-Transformers weights, so `hf.co/<that id>`
# — which is what src/embed.py builds — can never resolve. nomic-ai/nomic-embed-text-v1.5-GGUF
# is the same model, same publisher, converted; it pulls (49 MB) and returns the 768-dim
# vectors src/embed.py asserts on. Same class of bug as the Groq whisper id: the HF repo id
# is the name, but only the runnable variant of it is a name the runtime accepts.
#
# The :F16 tag is not decoration, and it is the single biggest quality lever found this week.
# `ollama pull hf.co/<repo>` with no tag picks the repo's smallest file, which here is
# Q2_K - 2-bit weights on a 137 M-param encoder. Swept on evals/dev, 346 chunks, 12
# answerable pairs, recall@5 by the QA_SPEC sec.2 rule:
#
#   Q2_K   no prefixes                    5/12 = 0.4167
#   F16    no prefixes                   11/12 = 0.9167
#   F16    nomic task prefixes both      10/12 = 0.8333
#   Q2_K   nomic task prefixes both       2/12 = 0.1667
#
# Two things in that table. Quantisation was the whole story: same code, same chunks, same
# questions, 0.42 -> 0.92 on 225 MB more weights. And the prefixes nomic documents
# ("search_document: " on chunks, "search_query: " on questions) cost 0.08 here rather than
# buying anything, so they are deliberately not used - see the README. Neither of those was
# predictable from reading the model card; both came out of the sweep.
model = "nomic-ai/nomic-embed-text-v1.5-GGUF:F16"

# Chroma persistent directory.  Relative to the project root.
chroma_path = "./chroma"

# Chroma collection name.  One collection per pipeline run is fine for the MVP;
# change this to version the index without deleting the old one.
collection = "vrag"

# How many chunks to send to Ollama in one embed call.  32 is a safe default;
# raise it if Ollama is local and you have RAM to spare.
batch_size = 32

[retrieve]
# Number of chunks to return per query.  The Phase 1 gate scores recall@5,
# so this is the lever that controls that number.
top_k = 5

[transcript]
# Which transcription arm to use.  "groq" hits the Groq API (GROQ_API_KEY required);
# "ollama" runs the model locally via Ollama (no API key, but the model must be pulled).
#
# Switch between them without touching any Python:
#   arm = "groq"    →  hosted, fast, free tier (rate-limited)
#   arm = "ollama"  →  local — but NOT for this model. See below.
#
# This one does not currently have a local arm, and that is not a missing pull. Two
# independent walls, both measured rather than assumed:
#
#   $ ollama pull hf.co/openai/whisper-large-v3-turbo
#   Error: pull model manifest: 400: {"error":"Repository is not GGUF or is not compatible
#   with llama.cpp"}
#
#   >>> import ollama; hasattr(ollama, "transcribe")
#   False                                     # ollama 0.32.14 — src/transcript._ollama_arm
#                                             # calls ollama.transcribe(), which is not there
#
# Ollama loads GGUF through llama.cpp; whisper is an encoder-decoder ASR model and is not
# that, so `hf.co/<repo>` can never resolve for it — the same class of bug as the nomic id
# in [embed], except that one had a -GGUF conversion to point at and this one does not.
#
# Flipping this to "ollama" does not fail at the pull, which is what makes it worth a
# comment this long: it fails at the *cache check*. transcript_for() reuses a cached
# transcript only when its recorded arm matches this value, so changing the arm invalidates
# every transcript already on disk and sends a 90 minute video back through an arm that
# cannot run — "no attribute 'transcribe'" on a file that was already transcribed.
#
# So the arm stays hosted, and a run with no GROQ_API_KEY cannot ingest new video. It can
# still answer over an index that already exists: [answer] and [embed] both run locally.
arm = "groq"

# Model, named by its HF repo id. The arm translates this to whatever its API expects.
model = "openai/whisper-large-v3-turbo"

# Language hint passed to the model.  Omit (set to "") to auto-detect.
# Explicit "en" is faster on English-only content.
language = "en"

# Upload cap for one ASR request, MB. Audio longer than this is split, transcribed piece by
# piece, and each piece's segment times are shifted back onto the video clock.
#
# Not a preference — a measured wall. Groq returns 413 above its own limit, and ingest writes
# 16 kHz mono s16le at 32 kB/s, so the arm tops out around 13 min of video per request:
#
#   $ uv run python -m src.index samples/611_H8fGd3fCJbg.mp4     # 30 min, 57.8 MB of wav
#   FAIL - groq arm failed: Error code: 413 - {'error': {'message': 'Request Entity Too
#   Large', 'type': 'invalid_request_error', 'code': 'request_too_large'}}
#
# The dev split is 1 short + 1 medium + 2 long by VRAG-004's quota, so without splitting half
# the dev set is un-indexable and the Phase 1 gate cannot be scored on the videos it names.
#
# 20.0 against a 25 MB cap: the multipart request carries the wav plus form overhead, and the
# margin costs one extra piece on a long video rather than a 413 at the end of an upload.
max_upload_mb = 20.0

# How far either side of a nominal cut to look for a quiet moment, seconds. A cut through the
# middle of a word costs that word twice — whisper hears half a syllable at the end of one
# piece and half at the start of the next. 5.0 s is enough to find a pause in speech; raising
# it makes pieces less even for no measured gain.
split_search_s = 5.0

[chunk]
# Time-window chunking — VRAG-014. Read by src/chunk.py.
#
# Windows are a fixed grid on the video clock (0, hop, 2·hop, …), so the same transcript
# chunks identically on every run and on either ASR arm. A segment is never cut in half,
# which is why a chunk's recorded t_start/t_end are measured from the segments inside it
# rather than copied off the grid.
#
# window_s has a ceiling that is not a matter of taste. QA_SPEC §2 scores a citation correct
# when |citation.t_start - t_ref| <= 30, and a citation points at the chunk it came from, so a
# chunk spanning more than 30 s can retrieve exactly the right passage and still be marked
# wrong because its start is too early.
#
# 30.0 is *not* that ceiling, which a measurement caught and the derivation had missed:
# segments are never split, so a chunk overhangs its window at *both* ends and the worst case
# is window_s + 2 × (longest segment). On dev video 181 the longest whisper segment is 4.16 s
# and window_s = 30.0 produced a 35.7 s chunk — 2 of 5 chunks past the tolerance. Swept on the
# cached transcript ($0.00, no model call):
#
#   window  overlap  chunks  max chunk  over 30 s
#   30.0    10.0     5       35.7 s     2
#   25.0     8.0     6       29.0 s     0
#   22.0     8.0     7       24.4 s     0
#
# 25.0 is the widest setting that keeps every chunk on *video 181* citable. VRAG-018 swept all
# four dev videos and that generalisation does not survive: 611's longest whisper segment is
# 29.98 s, not 181's 4.16 s, so the bound here is 25 + 2 x 29.98 = 85 s and 120 of the 346 dev
# chunks are longer than the 30 s tolerance — the longest is 53.8 s, and it is the same chunk at
# every window from 12 s up because its length comes from its segments, not from the grid.
#
# It costs no recall on evals/dev (recall@5 = 0.9167 at every window from 12 s to 45 s), so this
# value stands. What does not stand is the reasoning: re-sweep when the ASR arm changes, because
# the bound depends on that arm's segment lengths, and a window narrower than 25.0 will not fix
# a long chunk. docs/learning/primer-chunking-embeddings.md §4 has the working.
window_s = 25.0

# How much of each window the next one repeats. A sentence straddling a boundary then lands
# whole in at least one chunk. The cost is duplicated text — 1.79x the transcript across all
# four dev videos at these settings — so embedding spend scales with this number.
#
# VRAG-018 swept it. Two results worth having here. Overlap = 0 is not duplication = 1.0: it
# measures 1.22x, because segments are never split and a segment straddling a boundary is placed
# in both windows even when the windows do not overlap. And the whole visible recall benefit of
# overlap on evals/dev is one pair (d003, which at overlap 0 misses by 35.0 s against a 30 s
# tolerance); 2.0 already recovers it, and 8.0 recovers nothing further that 2.0 had not.
# 8.0 is kept because Phase 1 was graded on it, not because the sweep argues for it over 2.0 —
# on 12 pairs those two settings are tied. docs/learning/primer-chunking-embeddings.md §5.
overlap_s = 8.0

[answer]
# Phase 2 answering — VRAG-019. Read by src/answer.py.
#
# Which runtime the generator runs on, the same shape transcript.arm uses:
#
#   arm = "groq"     hosted, free tier, strict JSON schema at generation time
#   arm = "ollama"   local, no key, no network, no rate limit
#
# groq is the default, and #25 argued for ollama — so this comment owes both sides.
#
# The case for groq is measured. Same question, same index, same code, only this lever
# changed, via `make latency`:
#
#   arm = "groq"     answer.generate  1.166s   41.0% of a  2.8s run
#   arm = "ollama"   answer.generate 24.657s   92.5% of a 26.6s run
#
# 21× on the phase that dominates a run, and nothing else in the pipeline adds up to two
# seconds. A 26-second answer is not a demo anyone sits through.
#
# And it is the arm the gate can pass. tests/gates/gate_phase2a.py pins
# SCHEMA_VALID_THRESHOLD = 1.00 and reads ROOT/config.toml directly — there is no arm
# override on the command line — while the README table puts the local model at 12/15
# schema-valid and 1/3 abstentions. Measured both ways:
#
#   arm = "ollama"   gate_phase2a  3 failed,  7 passed   ·  make gate  5 failed, 50 passed
#   arm = "groq"     gate_phase2a         10 passed      ·  make gate  1 failed, 54 passed
#
# The case for ollama was availability: no key, no rate limit, and it keeps working after
# Groq's free tier spends its daily cap — which it did, mid-week, with the API returning 429
# on the first live call through it. That is a real failure and it happened. It is answered
# by the fallback rather than by the default: src.answer._ask already drops to
# answer.ollama_model on a 429, so groq-as-default is not "breaks when capped", it is fast
# path first and local safety net behind. What the fallback cannot do is make a gate pass,
# and a default whose workaround is a manual "flip this first" written in a comment is the
# failure mode `make gate` exists to catch.
#
# For a deliberately offline run — no key, no network, no cap — set "ollama" and expect the
# numbers above. src.answer.effective_model() and AnswerRun.model (#25) mean every
# report then names the model that actually answered, so a local run cannot be mistaken for
# a hosted one.
arm = "groq"

# Model, by HF repo id. openai/gpt-oss-120b is the one model in this pipeline whose HF repo
# id and Groq wire id are the same string; that is checked in src.answer._groq_wire_name and
# not assumed, because whisper's are not the same and neither are nomic's.
#
# Groq serves exactly two models with a real HF repo id and a chat endpoint —
# openai/gpt-oss-120b and openai/gpt-oss-20b. groq/compound* has no HF repo id and is out
# (CLAUDE.md). Local alternative for arm = "ollama":
#   model = "bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M"
model = "openai/gpt-oss-120b"

# Ollama model used when arm = "ollama" or when Groq hits its rate limit and falls back
# automatically. Must be pulled first: ollama pull hf.co/bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M
ollama_model = "bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M"

# Whether a Groq 429 may be answered by the local model instead of failing.
#
# true is right on a laptop: the free tier throttles, the bucket refills, and finishing the
# run on the 3B model beats stopping — as long as you can see it happened. `used` on the
# AnswerRun and the `provenance` block both report the model that actually answered, and the
# fallback prints a WARNING to stderr.
#
# false is right for anything whose output is a recorded number: a gate, a sweep, a deployed
# container. gpt-oss-120b and the 3B local model do not score the same (README: 15/15 vs
# 12/15 schema-valid on dev), so a silent substitution attributes one model's number to the
# other. config.deploy.toml sets this false for exactly that reason.
#
# This lever only governs 429. A **413** — the request being larger than the tier's whole
# per-minute budget — never falls back regardless, because there is nothing transient to
# ride out and the smaller model would answer a question the configured one refused to be
# asked. That distinction was measured: an overview build for video 611 asked for 17152
# tokens against a TPM limit of 8000 with a full bucket and `x-should-retry: false`, and the
# old code read it as throttling and quietly ran every build on the 3B model. See
# src/answer.py:_GroqRequestTooLargeError.
fallback = true

# How hard gpt-oss thinks before it answers: "low", "medium", "high", or "" to send nothing.
#
# Not a universal parameter — the gpt-oss family takes it and a model that does not would 400
# on it — so the empty string means "omit", not "use the provider default".
#
# "low" because reasoning tokens are charged against max_completion_tokens, and on this tier
# that cap is most of the per-minute budget. Measured on the fold window that broke first: at
# the default effort the model produced a good abstract and six people and was then cut off
# before `topics`, so strict mode rejected the whole reply for a missing property. The same
# window at "low" finished in 1539 completion tokens against the same 4000 cap.
#
# It is a quality lever as well as a cost one. Raise it if a measured number says to — the
# extraction here is "copy what the transcript says", which is not the kind of task that
# rewards long deliberation, and no number has yet said otherwise.
reasoning_effort = "low"

# The prompt, versioned on disk. Never inlined in code (README, prompts/). A prompt change
# that moves a number goes in answer_v2.md next to the measurement, so the prompt that
# produced a recorded result stays readable.
prompt = "prompts/answer_v1.md"

# 0.0 to remove the sampling variance we control. It does NOT make the run reproducible, and
# that was measured rather than assumed — the first thing this lever was believed to buy.
# Six identical calls for dev pair d001, same code, same config, same prompt, temperature 0.0:
#
#   ANSWER  "She says she will take you back."
#   ANSWER  "She says she will take you back."
#   ABSTAIN
#   ANSWER  "She says she will \"bang bang, all over you\"."
#   ABSTAIN
#   ANSWER  "She says she will \"bang bang all over you\"."
#
# 4 answers, 2 abstentions, and three different answer texts. The measurement is the six
# lines above; the usual explanation for it — an MoE model served in continuous batches, where
# the floating-point reduction depends on who else is in the batch — is not something this
# repo has verified, so treat it as the reason to expect variance and not as a result.
# temperature 0.0 pins the sampler, not the arithmetic. This caught a real gate
# defect before review: gate_phase2a passed with a per-pair 'no false abstentions' threshold,
# then failed the next run on d001 with nothing changed. A gate the supervisor re-runs has to
# have margin against this, which is why the abstention check there is a rate with a ceiling
# and not a per-pair assertion. Sampling above 0.0 is a lever to sweep only once there is a
# number that wants it.
temperature = 0.0

# Completion cap. Generous: an answer is one or two sentences plus at most a few citations,
# so ~200 tokens is typical, but gpt-oss emits reasoning tokens before the JSON and a cap
# that clips those returns a truncated object that fails validation — which would show up as
# "the model cannot follow the schema" when the real cause is the cap.
max_tokens = 1200

[overview]
# WHOLE-VIDEO QUESTIONS. Read by src/overview.py and by the overview branch of src/answer.py.
#
# "What is this video about?" and "who is taking part?" have no answer in any one 25-second
# chunk, so the extractive path declines them — correctly, under answer_v1.md rules 2 and 3,
# which are the rules that make the abstention selective on d013-d015. The synthesis happens
# here instead: once per video, at index time, over the whole transcript, into
# runs/<stem>/overview.json. A question asked in overview mode is answered from that document
# rather than from the transcript, which is why the per-question call stays small.
#
# The arm, the model, the temperature and the ollama fallback are all [answer]'s — one set of
# levers for one model, so a run's numbers stay attributable to one config fingerprint.

# The two prompts, versioned on disk like every other one. The first builds the document at
# index time; the second answers a question out of it.
prompt = "prompts/overview_v1.md"
answer_prompt = "prompts/overview_answer_v1.md"

# The reduce step of the fold: per-window abstracts in, one abstract of the whole video out.
# Only reached when a transcript needs more than one window, which on this tier is every real
# video. It is given no timestamps, so it cannot corrupt a span — `people` and `topics` are
# merged in code for exactly that reason (src/overview.py:_merge).
merge_prompt = "prompts/overview_merge_v1.md"

# Completion cap for a whole-video build — the single-window case, and the reduce step's
# ceiling. Higher than answer.max_tokens (1200) because the document is an abstract plus
# every person named plus one topic per stretch of the video — for the 56-minute meeting that
# is ~20 topic entries — and gpt-oss emits reasoning tokens before the JSON. A cap that clips
# them returns a truncated object that fails validation, which reads as "the model cannot
# follow the schema" when the cause is the cap.
max_tokens = 4000

# Completion cap for one window of the fold, which is a different and much smaller job: a
# quarter of a video yields a short abstract, a handful of names and a few topics. Separate
# from max_tokens above because the cap is charged against the per-minute budget whether it
# is used or not — reserving a whole-video 4000 for a quarter-video answer is what pushed the
# first folded run to 8315 tokens against a limit of 8000.
window_max_tokens = 4000

# Ceiling on the rendered transcript handed to the build call, in characters. Measured with
# src.overview.render_transcript over the indexed corpus:
#
#   vector7-21aug-client-meeting   321 chunks   100 726 chars   (56 min)
#   bob-video                      200 chunks    97 967 chars   (57 min)
#   611_H8fGd3fCJbg                107 chunks    50 325 chars   (25 min)
#
# Roughly twice the raw transcript, because chunks overlap by [chunk] overlap_s = 8 s of a
# 25 s window and the overlap is rendered rather than merged away — the model sees exactly
# the spans a citation is allowed to name.
#
# THIS WAS 180 000, AND THAT NUMBER MEASURED THE WRONG CONSTRAINT.
#
# ~100 000 characters is ~25 k tokens, which is indeed comfortably inside
# openai/gpt-oss-120b's *context window*. But the context window is not what binds here. The
# free `on_demand` tier meters **tokens per minute**, and it counts the prompt plus
# max_completion_tokens against that budget before the call runs. Measured, building 611:
#
#   413  "Request too large ... on tokens per minute (TPM): Limit 8000, Requested 17152"
#   x-ratelimit-remaining-tokens: 8000      <- a full bucket; nothing was throttling it
#   x-should-retry: false
#
# So the arithmetic that matters is the budget, not the window:
#
#   prompt_tokens + max_tokens <= 8000
#   8000 - 4000 (max_tokens above) - ~600 (the system prompt, 2 370 chars) = ~3 400 tokens
#   ~3 400 tokens x ~4.0 chars/token = ~13 600 characters
#
# The 4.0 chars/token ratio is measured on this content, not assumed: 52 853 characters of
# system + user came back priced at 13 152 prompt tokens.
#
# The two inputs were then measured rather than estimated, because the first folded run still
# came back 413 at "Requested 8315":
#
#   chars per token   3.531   (52 853 + 15 238 chars priced at 13 152 + 4 315 prompt tokens)
#   fixed overhead    2 528 chars   the overview system prompt plus the user template
#
# Transcript tokenises worse than prose — the `t_start=482.1` headers are digits and symbols,
# not words — so the 4.0 chars/token that holds for English is wrong here by 12 %.
#
#   (context + 2528) / 3.531 + window_max_tokens <= 8000
#   (10000  + 2528) / 3.531 + 4000               =  7548     <- 452 tokens of margin
#
# window_max_tokens was 2500 first, which bought 5 000 more characters of context per window
# and then failed differently: 400 `json_validate_failed` with `failed_generation: ''`. An
# empty generation is the cap being spent entirely on gpt-oss's reasoning tokens before the
# JSON begins — the exact failure the comment on max_tokens above describes, arriving at the
# window scale. Reasoning is charged whether or not it is shown, so the completion cap is not
# compressible below what the model thinks with, and the context is what has to give.
#
# Every video in the corpus is far over one window — the smallest is 611 at 50 325 — which is
# the honest finding rather than a reason to raise the number: **no real transcript fits one
# call on this tier.** src.overview.build therefore folds the transcript into windows of this
# size and merges the partials, and this ceiling is what sizes a window. It is no longer a
# "raise it if the video is long" lever; raising it past the TPM budget only moves the
# failure from a fast local check to a 413 from the provider.
max_context_chars = 10000

[ask]
# THE DEMO — VRAG-020. Read by src/ask.py.
#
# How many seconds before a citation's t_start the player is seeked to. A citation names the
# chunk boundary, and a chunk boundary is a grid line on the video clock (see [chunk]) — it
# is not where the sentence being cited begins. Landing exactly on it drops the viewer into
# the middle of a word about as often as not, and the demo then reads as an off-by-a-second
# citation when the citation is right.
#
# 5.0 is under the ±30 s QA_SPEC §2 tolerance by a wide margin, so the padded start is still
# inside the window the citation is scored on. It is a viewing lever only: nothing measured
# reads it, and the numbers on the card are unaffected by changing it.
pad_s = 5.0

[api]
# The HTTP API — read by src/api.py. `make api` serves the same pipeline `make ask` runs, so
# a frontend can reach it; nothing here changes an answer, only who is allowed to ask for one
# and what a citation's url points at.

# Where the server binds. 127.0.0.1 and not 0.0.0.0 on purpose: with serve_media = true this
# process range-serves corpus video off this disk, and Video-MME's terms forbid
# redistributing it (data/corpus/PROVENANCE.md). Binding to a loopback address means
# "serving" it reaches this machine and no other. Overridable per run — `make api
# HOST=0.0.0.0` — which is a decision about the licence and not about convenience.
host = "127.0.0.1"
port = 8000

# Browser origins allowed to call this API, exact and enumerated. Not "*": a wildcard on a
# server that streams corpus media lets any page in any tab read it, and the whole use case
# is one frontend on one known port. An empty list installs no CORS middleware at all, which
# is right for curl and for a frontend served by this same origin, and blocks a browser app
# on another port — the symptom is a CORS error in the console, and the fix is this line.
cors_origins = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:5173", "http://127.0.0.1:5173"]

# Whether GET /media/{video_id} serves the media files `make sample-real` fetched into
# samples/. true is what makes an in-page player possible, because a browser cannot follow
# the file:// path the static demo page uses. Set it false on any host that is not this
# laptop: a citation still carries source_url, which opens the original upload at the same
# second and is the only copy this project may point at.
serve_media = true
