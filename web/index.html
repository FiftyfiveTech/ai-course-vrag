<!doctype html>
<!--
  The frontend for src/api.py. Static files, no build step, no node toolchain: `make setup`
  and `make demo` have to work from a clean clone, and a second package manager would make
  that a lie. It is served by the API itself (GET /, GET /static/*), which is not laziness —
  same origin means the fetch to /ask needs no CORS entry and a citation's stream_url
  (/media/611) resolves against the page it came from, so the <video> can range-seek it.

  Everything on the page comes from one POST /ask response. The shapes are in schemas/api.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRAG — ask your videos</title>
<meta name="description" content="Ask a question about a corpus of indexed videos and get an answer with the seconds it came from.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='24' font-family='system-ui' font-weight='700'>55</text></svg>">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">55</span>
    <span class="brandtext">
      <span class="org">fiftyfive</span>
      <span class="product">VRAG</span>
    </span>
  </div>

  <div class="topbar-right">
    <!-- Filled by GET /health. A question box over an empty index looks like a working demo
         of nothing — every question abstains — so the state is on screen, not in a console. -->
    <button type="button" class="status" id="status" data-state="loading" title="index status">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">checking…</span>
    </button>
    <!-- Which config bytes produced what is on screen. In the bar and not a fixed corner
         footer: a corner footer sits on top of the example chips at ordinary widths, which
         is how this one was found. -->
    <span class="fingerprint" id="foot-config">config —</span>
    <a class="ghost" href="/docs" target="_blank" rel="noopener">API</a>
  </div>
</header>

<main>

  <section class="hero" id="hero">
    <h1>Ask your videos.</h1>
    <p class="sub">Every answer comes back with the video and the second it was taken from — or it comes back declining.</p>
  </section>

  <!-- The transcript. One .turn per question; each holds the question bubble, the answer
       bubble, its citations and a player. Empty until the first ask. -->
  <section id="thread" class="thread" aria-live="polite"></section>

  <form class="composer" id="composer" autocomplete="off">
    <!-- position:relative lives here and not on .field, because the @ menu opens *above* the
         input and has to be measured against the whole composer rather than the pill. -->
    <div class="ask">
      <!-- The source picker. Filled from GET /videos, opened by typing @, and offering only
           sources the index actually holds: a handle this menu shows and /ask then refuses
           would be a control that looks live and is not. -->
      <div class="mentions" id="mentions" role="listbox" aria-label="sources to scope to" hidden></div>
      <div class="field">
        <!-- The tag highlighter. An <input> cannot style part of its own value, so the value
             is drawn a second time in this div, directly behind a transparent input, with the
             @tags wrapped in a pill. It is aria-hidden because the input still carries the
             real text for a screen reader — this is paint, not content. Everything about it
             is metric-neutral (see .highlight in styles.css): if it ever drifted by a pixel
             the caret would stop lining up with the letters. -->
        <div class="input-wrap">
          <div class="highlight" id="qhl" aria-hidden="true"></div>
          <input id="q" name="q" type="text" maxlength="1000" required
                 placeholder="What two tools do I need to make my first paper cut?"
                 aria-label="your question" role="combobox" aria-expanded="false"
                 aria-controls="mentions" aria-autocomplete="list">
        </div>
        <button type="submit" id="send" aria-label="ask">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="examples" id="examples"></div>
    <p class="hint">Type <kbd>@</kbd> to answer from one video only.</p>
  </form>

</main>

<script src="/static/app.js"></script>
</body>
</html>
